services:

  mysql:
    image: mysql:8.0
    container_name: bde-events-mysql
    environment:
      MYSQL_DATABASE: bde_events
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: bde_user
      MYSQL_PASSWORD: bde_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: fadaldrame/bde-events-api:v1
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bde-events-api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: bde_events
      DB_USERNAME: bde_user
      DB_PASSWORD: bde_password
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  react:
    image: fadaldrame/bde-events-react:v1
    build:
      context: ./bedEvent-React
      dockerfile: Dockerfile
    container_name: bde-events-react
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mysql_data: